name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Dummy values so `next build` can complete — real values are only
          # needed at runtime (Vercel env vars), not at build time, since
          # these are only read inside Server Actions/Route Handlers.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder

  schema-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # NOTE: db/schema.sql is kept as the single cumulative source of
      # truth — every db/2026-*.sql migration's changes get folded back
      # into it once shipped (see the header of most of those files, and
      # the project's own notes). The dated files are one-time patches
      # meant to be run ONCE against the live Supabase DB, not replayed on
      # top of a fresh schema.sql — doing so double-applies anything
      # already folded in (fails with "already exists") and some older
      # ones (2026-08-05-*) also reference Supabase's own `auth.users`
      # table, which doesn't exist in a plain throwaway Postgres. So this
      # check only verifies schema.sql itself applies cleanly to a fresh
      # database — that's the meaningful regression test (can a fresh
      # environment be stood up from schema.sql alone), not "replay every
      # historical patch file."
      - name: Apply schema.sql to a throwaway database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE oms_ci_test;"
          # Supabase roles referenced by the RLS policies must exist in the
          # throwaway cluster too — without them every CREATE POLICY errored
          # (and, because psql kept going, the failure was silent).
          psql -h localhost -U postgres -d oms_ci_test -c "CREATE ROLE authenticated NOLOGIN; CREATE ROLE anon NOLOGIN; CREATE ROLE service_role NOLOGIN;"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d oms_ci_test -f db/schema.sql

      # Compares table/column coverage instead of the exact file: the
      # committed types carry intentional hand annotations and are not the
      # generator's byte-for-byte output, so the old `git diff --exit-code`
      # could never pass (it had been red on main for many commits). The
      # script still fails on a real schema/type drift, in both directions.
      - name: Verify database types cover the schema
        env:
          GEN_TYPES_DB_URL: postgresql://postgres:postgres@localhost:5432/oms_ci_test
        run: node scripts/check-types-in-sync.mjs
